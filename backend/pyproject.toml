[project]
name = "supervisely-qc-backend"
version = "1.0.0"
description = "Local macOS FastAPI QC Engine for Quantigo Supervisely Hybrid QC Assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "shapely>=2.0.6",
    "numpy>=1.26.4,<2.3.0",
    "opencv-python-headless>=4.10.0.84",
    "scipy>=1.14.0",
    "pillow>=11.0.0",
    "psutil>=6.1.0",
    "python-multipart>=0.0.17",
    "anyio>=4.6.0",
]

[project.optional-dependencies]
vision = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "ultralytics>=8.3.0",
    "transformers>=4.46.0",
    "timm>=1.0.11",
    "huggingface-hub>=0.26.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
