profileId: "default"
name: "Default Quantigo QC Profile"
description: "Balanced rule and vision defaults across all 5 Supervisely annotation primitives."
isBuiltin: true
matchers:
  jobTitleRegex: null
  projectIds: []
  datasetIds: []
workflowRules:
  blockOnUnsavedSync: true
  warnOnEmptyImageWithoutConfirm: true
tagRules:
  imageOnlyTags: []
  objectOnlyTags:
    - "Occlusion"
  occlusionOverlapIouThreshold: 0.10
  occlusionCoverRatioThreshold: 0.15
  flagForegroundOcclusionFalsePositive: true
geometryRules:
  minBoxAreaPx: 64
  minPolygonVertices: 3
  minPolylineVertices: 2
  minMaskAreaPx: 32
  maxDisconnectedMaskComponents: 8
  edgeSnapMarginPx: 3
  minBoxIouTightness: 0.72
  requireRequiredGraphNodes: true
visionRules:
  missedObjectMinConfidence: 0.45
  minLaplacianSharpness: 35.0
  ignoreBackgroundBokeh: true
  enableDepthOcclusionOrdering: true
classOverrides: {}
