profileId: "quantigo-polyline-v1"
name: "Quantigo Polyline & Lane Jobs"
description: "Enforces polyline continuity, acute backtrack spike detection, and endpoint gap warnings."
isBuiltin: true
matchers:
  jobTitleRegex: "lane|road[_ ]?line|polyline"
  projectIds: []
  datasetIds: []
workflowRules:
  blockOnUnsavedSync: true
  warnOnEmptyImageWithoutConfirm: true
tagRules:
  imageOnlyTags: []
  objectOnlyTags:
    - "Occlusion"
    - "Truncation"
    - "Truncated"
  occlusionOverlapIouThreshold: 0.10
  occlusionCoverRatioThreshold: 0.15
  flagForegroundOcclusionFalsePositive: true
geometryRules:
  minBoxAreaPx: 64
  minPolygonVertices: 3
  minPolylineVertices: 2
  minMaskAreaPx: 32
  maxDisconnectedMaskComponents: 8
  edgeSnapMarginPx: 3
  minBoxIouTightness: 0.72
  requireRequiredGraphNodes: true
visionRules:
  missedObjectMinConfidence: 0.50
  minLaplacianSharpness: 32.0
  ignoreBackgroundBokeh: true
  enableDepthOcclusionOrdering: true
classOverrides: {}
